{% extends 'base.html' %}
{% load static %}

{% block title %}blackjack Cards{% endblock title %}
{% block h1 %}blackjack Cards{% endblock h1 %}

{% block content %}
    <div>
        <form method="post" action="{% url 'blackjack:home' %}" class="p-4 m-4 bg-light border border-success rounded form-group" width="100">
            {% csrf_token %}
            {% if error_mes %}
                <p>{{ error_mes }}</p>
            {% endif %}
            <label for="bet_amount">賭け金を入力</label>
            <input type="text" class="form-control" name="bet_amount">
            <button type="submit" class="btn btn-success mt-4">決定</button>
        </form>
    </div>
