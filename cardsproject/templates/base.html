{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock title %}Cards Casino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">

  </head>
  <body style="--bs-body-color: #333;">
    <nav class="navbar navbar-dark bg-success stinky-top">
        <div class="navbar-nav d-flex flex-row">
            {% if request.user.is_authenticated %}
                <span class="text-white me-3">
                    <p> {{ request.user.username }}さん</p>
                </span>
                <span class="text-white me-3">
                    <strong>所持金：{{ request.user.money }}円</strong>
                </span>
                <form action="{% url 'accounts:logout' %}" method='post' name='logout'>
                    {% csrf_token %}
                    <a class="nav-link mx-3" href="javascript:logout.submit()">ログアウト</a>
                </form>
            {% else %}
                <a class="nav-link mx-3" href="{% url 'accounts:login' %}">ログイン</a>
                <a class="nav-link mx-3" href="{% url 'accounts:signup' %}">会員登録</a>
            {% endif %} 
        </div>
    </nav>
    <h1>{% block h1 %}{% endblock %}</h1>
    {% block content %}{% endblock content %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
  </body>
</html>
